ter-brand {\r\n    animation: slideInLeft 0.8s ease-out;\r\n}\r\n\r\n.footer-section:nth-child(2) {\r\n    animation: fadeInUp 0.8s ease-out 0.1s both;\r\n}\r\n\r\n.footer-section:nth-child(3) {\r\n    animation: fadeInUp 0.8s ease-out 0.2s both;\r\n}\r\n\r\n.footer-section:nth-child(4) {\r\n    animation: slideInRight 0.8s ease-out 0.3s both;\r\n}\r\n\r\n/* Logo animation */\r\n.footer-brand img {\r\n    transition: all 0.3s ease;\r\n}\r\n\r\n.footer-brand:hover img {\r\n    transform: scale(1.05);\r\n    filter: brightness(1.1);\r\n}\r\n\r\n/* Footer links animation */\r\n.footer-link {\r\n    position: relative;\r\n    display: inline-block;\r\n}\r\n\r\n.footer-link::before {\r\n    content: '';\r\n    position: absolute;\r\n    bottom: -2px;\r\n    left: 0;\r\n    width: 0;\r\n    height: 2px;\r\n    background-color: #ffc107;\r\n    transition: width 0.3s ease;\r\n}\r\n\r\n.footer-link:hover::before {\r\n    width: 100%;\r\n}\r\n\r\n/* Social links animation */\r\n.social-item {\r\n    animation: fadeInUp 0.6s ease-out both;\r\n}\r\n\r\n.social-item:nth-child(1) { animation-delay: 0.1s; }\r\n.social-item:nth-child(2) { animation-delay: 0.2s; }\r\n.social-item:nth-child(3) { animation-delay: 0.3s; }\r\n.social-item:nth-child(4) { animation-delay: 0.4s; }\r\n.social-item:nth-child(5) { animation-delay: 0.5s; }\r\n\r\n.social-link {\r\n    position: relative;\r\n    overflow: hidden;\r\n}\r\n\r\n.social-link::before {\r\n    content: '';\r\n    position: absolute;\r\n    top: 0;\r\n    left: -100%;\r\n    width: 100%;\r\n    height: 100%;\r\n    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);\r\n    transition: left 0.5s ease;\r\n}\r\n\r\n.social-link:hover::before {\r\n    left: 100%;\r\n}\r\n\r\n/* Responsive design */\r\n@media (max-width: 768px) {\r\n    .footer-section {\r\n        margin-bottom: 2rem;\r\n    }\r\n    \r\n    .social-item {\r\n        margin-bottom: 0.75rem;\r\n    }\r\n    \r\n    .social-link {\r\n   