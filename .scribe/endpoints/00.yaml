        status: 200
        content: "<link href=\"https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n     .daily-report-table {\n        width: 100%;\n        border-collapse: collapse;\n        font-size: 10px;\n        font-family: 'Poppins',\n        sans-serif !important;\n    }\n\n    .daily-report-table td,\n    .daily-report-table th {\n        vertical-align: top;\n    }\n\n    .daily-report-table strong {\n        font-weight: 300;\n        font-size: 12px;\n    }\n\n    .table-responsive {\n\n        font-size: 12px;\n    }\n</style>\n<!DOCTYPE html>\n<html lang=\"en\" dir=\"ltr\">\n    <head>\n        <meta charset=\"utf-8\">\n        <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n        <meta name=\"csrf-token\" content=\"hK44ff1pSTGE23UFOeadOVv008VWQ7pXODMpcdxy\">\n\n        \n        <meta name=\"description\" content=\"A salon and beauty center management system to streamline daily operations, improve efficiency, reduce errors, delight customers, and provide accurate data for better decisions.\">\n        <meta property=\"og:type\" content=\"website\">\n        <meta property=\"og:title\" content=\"Luzori - Run Your Salon Smarter.\">\n        <meta property=\"og:description\" content=\"A salon and beauty center management system to streamline daily operations, improve efficiency, reduce errors, delight customers, and provide accurate data for better decisions.\">\n        <meta property=\"og:image\" content=\"http://localhost:8000/assets/img/background.png\">\n        <meta property=\"og:url\" content=\"//\">\n        <meta property=\"og:locale\" content=\"en\">\n        <meta name=\"twitter:card\" content=\"summary_large_image\">\n        <meta name=\"twitter:title\" content=\"Luzori - Run Your Salon Smarter.\">\n        <meta name=\"twitter:description\" content=\"A salon and beauty center management system to streamline daily operations, improve efficiency, reduce errors, delight customers, and provide accurate data for better decisions.\">\n        <meta name=\"twitter:image\" content=\"http://localhost:8000/assets/img/background.png\">\n    <title>Luzori - Run Your Salon Smarter.</title>\n\n        <!-- Fonts -->\n    <link href=\"https://fonts.bunny.net/css2?family=Inter:wght@300;400;500;600;700&display=swap\" rel=\"stylesheet\">\n    \n    <!-- Bootstrap CSS -->\n    <link href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css\" rel=\"stylesheet\">\n    \n    <!-- Custom Styles -->\n        <style>\n            body {\n            font-family: 'Inter', sans-serif;\n            background-color: #212529;\n            color: white;\n        }\n        \n        /* Custom scrollbar */\n        ::-webkit-scrollbar {\n            width: 8px;\n        }\n        \n        ::-webkit-scrollbar-track {\n            background: #212529;\n        }\n        \n        ::-webkit-scrollbar-thumb {\n            background: #ffc107;\n            border-radius: 4px;\n        }\n        \n        ::-webkit-scrollbar-thumb:hover {\n            background: #e0a800;\n        }\n        \n        .hero-section {\n            min-height: 100vh;\n            position: relative;\n            overflow: hidden;\n        }\n\n        .hero-section::before {\n            content: '';\n            position: absolute;\n            top: 0;\n            right: 0;\n            bottom: 0;\n            left: 0;\n            background-image: url('http://localhost:8000/assets/img/background.png');\n            background-size: cover;\n            background-position: center;\n            background-repeat: no-repeat;\n            filter: blur(6px);\n            transform: scale(1.05); /* avoid edge transparency after blur */\n            z-index: 0;\n        }\n\n        .hero-section .container {\n            position: relative;\n            width: 90%;\n            z-index: 1;\n        }\n        \n        .btn-custom {\n            background-color: #ffc107;\n            border-color: #ffc107;\n            color: #212529;\n            font-weight: 500;\n            padding: 6px 20px;\n            border-radius: 6px;\n            font-size: 0.8rem;\n            transition: all 0.3s ease;\n        }\n        \n        .btn-custom:hover {\n            background-color: #e0a800;\n            border-color: #e0a800;\n            color: #212529;\n            transform: translateY(-2px);\n            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);\n        }\n        \n        .btn-outline-custom {\n            border: 2px solid #ffc107;\n            color: #ffc107;\n            background-color: transparent;\n            font-weight: 500;\n            padding: 4px 20px;\n            border-radius: 6px;\n            font-size: 0.8rem;\n            transition: all 0.3s ease;\n        }\n        \n        .btn-outline-custom:hover {\n            background-color: #ffc107;\n            border-color: #ffc107;\n            color: #212529;\n            transform: translateY(-2px);\n        }\n        \n        /* Mobile spacing adjustments */\n        @media (max-width: 768px) {\n            .hero-section {\n                min-height: 60vh;\n                padding-bottom: 2rem;\n            }\n            \n            #about {\n                margin-top: -1rem;\n            }\n            }\n        </style>\n    </head>\n<body>\n    <!-- Header Component -->\n    <!-- Header Component -->\r\n<header class=\"bg-dark text-white sticky-top shadow-lg\" style=\"z-index: 1050; transition: all 0.3s ease-in-out;\">\r\n    <!-- Top Bar -->\r\n    <div class=\"bg-secondary py-2\" style=\"transition: all 0.3s ease-in-out;\">\r\n        <div class=\"container-fluid\">\r\n            <!-- Desktop Layout -->\r\n            <div class=\"row align-items-center d-none d-md-flex\">\r\n                <div class=\"col-md-6\">\r\n                    <div class=\"d-flex align-items-center\">\r\n                      