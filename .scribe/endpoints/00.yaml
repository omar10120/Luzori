mail\" class=\"form-label text-white fw-bold\">Email</label>\r\n                                        <input type=\"email\" class=\"form-control\" id=\"email\" name=\"email\" placeholder=\"example@email.com\" required style=\"background-color: #495057; border: 1px solid #6c757d; color: white;\" onfocus=\"this.style.borderColor='#ffc107'\" onblur=\"this.style.borderColor='#6c757d'\">\r\n                                        <div class=\"invalid-feedback\">\r\n                                            Please provide a valid email address.\r\n                                        </div>\r\n                                    </div>\r\n                                    \r\n                                    <!-- Phone Field with Country Code -->\r\n                                    <div class=\"col-md-6\">\r\n                                        <label for=\"phone\" class=\"form-label text-white fw-bold\">Phone Number</label>\r\n                                        <div class=\"input-group\">\r\n                                            <span class=\"input-group-text bg-transparent border-secondary\">\r\n                                                <img id=\"countryFlag\" src=\"https://flagcdn.com/w20/ae.png\" alt=\"flag\" width=\"20\" height=\"14\" style=\"border-radius: 2px;\">\r\n                                            </span>\r\n                                            <select class=\"form-select flex-grow-0\" id=\"country_code\" name=\"country_code\" aria-label=\"Country code\" style=\"max-width: 120px; background-color: #495057; border: 1px solid #6c757d; color: white;\">  \r\n                                                <option value=\"+971\" selected>+971</option>\r\n                                                <option value=\"+966\">+966</option>\r\n                                                <option value=\"+974\">+974</option>\r\n                                                <option value=\"+968\">+968</option>\r\n                                                <option value=\"+965\">+965</option>\r\n                                                <option value=\"+973\">+973</option>\r\n                                                <option value=\"+20\">+20</option>\r\n                                                <option value=\"+963\">+963</option>\r\n                                                <option value=\"+962\">+962</option>\r\n                                                <option value=\"+970\">+970</option>\r\n                                                <option value=\"+961\">+961</option>\r\n                                                <option value=\"+90\">+90</option>\r\n                                                <option value=\"+212\">+212</option>\r\n                                                <option value=\"+216\">+216</option>\r\n                                                <option value=\"+213\">+213</option>\r\n                                                <option value=\"+44\">+44</option>\r\n                                                <option value=\"+1\">+1</option>\r\n                                                <option value=\"+49\">+49</option>\r\n                                                <option value=\"+33\">+33</option>\r\n                                                <option value=\"+91\">+91</option>\r\n                                                <option value=\"+92\">+92</option>\r\n                                            </select>\r\n                                            <input type=\"tel\" class=\"form-control\" id=\"phone\" name=\"phone\" placeholder=\"Phone Number\" style=\"background-color: #495057; border: 1px solid #6c757d; color: white;\" onfocus=\"this.style.borderColor='#ffc107'\" onblur=\"this.style.borderColor='#6c757d'\">\r\n                                        </div>\r\n                                    </div>\r\n                                    \r\n                                    <!-- Subject Field -->\r\n                                    <div class=\"col-md-6\">\r\n                                        <label for=\"subject\" class=\"form-label text-white fw-bold\">Subject</label>\r\n                                        <input type=\"text\" class=\"form-control\" id=\"subject\" name=\"subject\" placeholder=\"Project Subject\" style=\"background-color: #495057; border: 1px solid #6c757d; color: white;\" onfocus=\"this.style.borderColor='#ffc107'\" onblur=\"this.style.borderColor='#6c757d'\">\r\n                                    </div>\r\n                                    \r\n                                    <!-- Message Field -->\r\n                                    <div class=\"col-12\">\r\n                                        <label for=\"message\" class=\"form-label text-white fw-bold\">Message <span class=\"text-warning\">*</span></label>\r\n                                        <textarea class=\"form-control\" id=\"message\" name=\"message\" rows=\"4\" placeholder=\"Write Your Message...\" required style=\"background-color: #495057; border: 1px solid #6c757d; color: white; resize: vertical;\" onfocus=\"this.style.borderColor='#ffc107'\" onblur=\"this.style.borderColor='#6c757d'\"></textarea>\r\n                                        <div class=\"invalid-feedback\">\r\n                                            Please provide your message.\r\n                                        </div>\r\n                                    </div>\r\n                                    \r\n                                    <!-- Submit Button -->\r\n                                    <div class=\"col-12 text-center\">\r\n                                        <button type=\"submit\" class=\"btn btn-warning px-4 py-2 fw-bold rounded-pill\" style=\"background: linear-gradient(135deg, #ffc107 0%, #e0a800 100%); border: none; box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3); transition: all 0.3s ease;\" onmouseover=\"this.style.transform='translateY(-2px)'; this.style.boxShadow='0 8px 25px rgba(255, 193, 7, 0.4)'\" onmouseout=\"this.style.transform='translateY(0)'; this.style.boxShadow='0 5px 15px rgba(255, 193, 7, 0.3)'\">\r\n                                            Send Message\r\n                                        </button>\r\n                                    </div>\r\n                                </div>\r\n                            </form>\r\n                        </div>\r\n                    </div>\r\n                </div>\r\n            </div>\r\n        </div>\r\n    </div>\r\n</section>\r\n\r\n<script>\r\n// Form validation and submission\r\ndocument.addEventListener('DOMContentLoaded', function() {\r\n    const form = document.getElementById('contactForm');\r\n    const submitBtn = form.querySelector('button[type=\"submit\"]');\r\n    \r\n    form.addEventListener('submit', function(event) {\r\n        event.preventDefault();\r\n        event.stopPropagation();\r\n        \r\n        if (form.checkValidity()) {\r\n            // Show loading state\r\n            const originalText = submitBtn.innerHTML;\r\n            submitBtn.innerHTML = '<span class=\"spinner-border spinner-border-sm me-2\" role=\"status\" aria-hidden=\"true\"></span>Sending...';\r\n            submitBtn.disabled = true;\r\n            \r\n            // Prepare form data\r\n            const formData = new FormData(form);\r\n            \r\n            // Send AJAX request\r\n            fetch(form.action, {\r\n                method: 'POST',\r\n                body: formData,\r\n                headers: {\r\n                    'X-Requested-With': 'XMLHttpRequest',\r\n                    'X-CSRF-TOKEN': document.querySelector('meta[name=\"csrf-token\"]')?.getAttribute('content') || formData.get('_token')\r\n                }\r\n            })\r\n            .then(response => response.json())\r\n            .then(data => {\r\n                if (data.success) {\r\n                    showSuccessMessage(data.message);\r\n                    form.reset();\r\n                    form.classList.remove('was-validated');\r\n                } else {\r\n                    showErrorMessage(data.message || 'An error occurred. Please try again.');\r\n                }\r\n            })\r\n            .catch(error => {\r\n                console.error('Error:', error);\r\n                showErrorMessage('Network error. Please check your connection and try again.');\r\n            })\r\n            .finally(() => {\r\n                // Reset button state\r\n                submitBtn.innerHTML = originalText;\r\n                submitBtn.disabled = false;\r\n            });\r\n        } else {\r\n            form.classList.add('was-validated');\r\n        }\r\n    });\r\n    \r\n    // Real-time validation\r\n    const inputs = form.querySelectorAll('input, textarea');\r\n    inputs.forEach(input => {\r\n        input.addEventListener('blur', function() {\r\n            if (this.checkValidity()) {\r\n                this.classList.remove('is-invalid');\r\n                this.classList.add('is-valid');\r\n            } else {\r\n                this.classList.remove('is-valid');\r\n                this.classList.add('is-invalid');\r\n            }\r\n        });\r\n    });\r\n});\r\n\r\nfunction showSuccessMessage(message = 'Your message has been sent successfully! We\\'ll get back to you soon!') {\r\n    // Create success alert\r\n    const alertDiv = document.createElement('div');\r\n    alertDiv.className = 'alert alert-success alert-dismissible fade show position-fixed';\r\n    alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';\r\n    alertDiv.innerHTML = `\r\n        <strong>Success!</strong> ${message}\r\n        <button type=\"button\" class=\"btn-close\" data-bs-dismiss=\"alert\"></button>\r\n    `;\r\n    \r\n    document.body.appendChild(alertDiv);\r\n    \r\n    // Auto remove after 5 seconds\r\n    setTimeout(() => {\r\n        if (alertDiv.parentNode) {\r\n            alertDiv.remove();\r\n        }\r\n    }, 5000);\r\n}\r\n\r\nfunction showErrorMessage(message) {\r\n    // Create error alert\r\n    const alertDiv = document.createElement('div');\r\n    alertDiv.className = 'alert alert-danger alert-dismissible fade show position-fixed';\r\n    alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';\r\n    alertDiv.innerHTML = `\r\n        <strong>Error!</strong> ${message}\r\n        <button type=\"button\" class=\"btn-close\" data-bs-dismiss=\"alert\"></button>\r\n    `;\r\n    \r\n    document.body.appendChild(alertDiv);\r\n    \r\n    // Auto remove after 7 seconds\r\n    setTimeout(() => {\r\n        if (alertDiv.parentNode) {\r\n            alertDiv.remove();\r\n        }\r\n    }, 7000);\r\n}\r\n\r\n// Add focus effects to form controls\r\ndocument.querySelectorAll('.form-control').forEach(control => {\r\n    control.addEventListener('focus', function() {\r\n        this.style.borderColor = '#ffc107';\r\n        this.style.boxShadow = '0 0 0 0.2rem rgba(255, 193, 7, 0.25)';\r\n    });\r\n    \r\n    control.addEventListener('blur', function() {\r\n        this.style.borderColor = '#6c757d';\r\n        this.style.boxShadow = 'none';\r\n    });\r\n});\r\n</script>\r\n\r\n<script>\r\n// Update country flag when country code changes\r\ndocument.addEventListener('DOMContentLoaded', function(){\r\n    const select = document.getElementById('country_code');\r\n    const flagImg = document.getElementById('countryFlag');\r\n    const map = {\r\n        '+971': 'ae', '+966': 'sa', '+974': 'qa', '+968': 'om', '+965': 'kw', '+973': 'bh',\r\n        '+20': 'eg', '+963': 'sy', '+962': 'jo', '+970': 'ps', '+961': 'lb', '+90': 'tr',\r\n        '+212': 'ma', '+216': 'tn', '+213': 'dz', '+44': 'gb', '+1': 'us', '+49': 'de',\r\n        '+33': 'fr', '+91': 'in', '+92': 'pk'\r\n    };\r\n    function updateFlag(){\r\n        const code = select ? select.value : '+971';\r\n        const cc = map[code] || 'ae';\r\n        if(flagImg){ flagImg.src = `https://flagcdn.com/w20/${cc}.png`; }\r\n    }\r\n    if(select){\r\n        select.addEventListener('change', updateFlag);\r\n        updateFlag();\r\n    }\r\n});\r\n</script>\r\n\r\n<style>\r\n/* Contact Section Animations */\r\n@keyframes fadeInUp {\r\n    from {\r\n        opacity: 0;\r\n        transform: translateY(30px);\r\n    }\r\n    to {\r\n        opacity: 1;\r\n        transform: translateY(0);\r\n    }\r\n}\r\n\r\n@keyframes slideInLeft {\r\n    from {\r\n        opacity: 0;\r\n        transform: translateX(-50px);\r\n    }\r\n    to {\r\n        opacity: 1;\r\n        transform: translateX(0);\r\n    }\r\n}\r\n\r\n@keyframes slideInRight {\r\n    from {\r\n        opacity: 0;\r\n        transform: translateX(50px);\r\n    }\r\n    to {\r\n        opacity: 1;\r\n        transform: translateX(0);\r\n    }\r\n}\r\n\r\n/* Section animations */\r\n.contact-info-card {\r\n    animation: slideInLeft 0.8s ease-out;\r\n}\r\n\r\n.contact-form-card {\r\n    animation: slideInRight 0.8s ease-out;\r\n}\r\n\r\n/* Contact info card hover effect */\r\n.contact-info-card:hover {\r\n    transform: translateY(-5px);\r\n    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4) !important;\r\n    border-color: rgba(255, 193, 7, 0.5) !important;\r\n}\r\n\r\n/* Contact items animation */\r\n.contact-item {\r\n    animation: fadeInUp 0.6s ease-out both;\r\n}\r\n\r\n.contact-item:nth-child(2) {\r\n    animation-delay: 0.1s;\r\n}\r\n\r\n.contact-item:nth-child(3) {\r\n    animation-delay: 0.2s;\r\n}\r\n\r\n.contact-item:nth-child(4) {\r\n    animation-delay: 0.3s;\r\n}\r\n\r\n/* Contact icon hover effect */\r\n.contact-icon {\r\n    transition: all 0.3s ease;\r\n}\r\n\r\n.contact-item:hover .contact-icon {\r\n    transform: scale(1.1);\r\n    background-color: rgba(255, 193, 7, 0.3) !important;\r\n}\r\n\r\n/* Form styling */\r\n.form-control {\r\n    transition: all 0.3s ease;\r\n}\r\n\r\n.form-control:focus {\r\n    border-color: #ffc107 !important;\r\n    box-shadow: 0 0 0 0.2rem rgba(255, 193, 7, 0.25) !important;\r\n}\r\n\r\n.form-control::placeholder {\r\n    color: #adb5bd;\r\n}\r\n\r\n/* RTL alignment for Arabic locale */\r\n[dir=\"rtl\"] input.form-control,\r\n[dir=\"rtl\"] textarea.form-control {\r\n    direction: rtl;\r\n    text-align: right;\r\n}\r\n\r\n/* Keep numbers LTR inside RTL layouts */\r\n.ltr-number {\r\n    direction: ltr !important;\r\n    unicode-bidi: bidi-override;\r\n}\r\n\r\n[dir=\"rtl\"] input.form-control::placeholder,\r\n[dir=\"rtl\"] textarea.form-control::placeholder {\r\n    direction: rtl;\r\n    text-align: right;\r\n}\r\n\r\n/* Button animation */\r\n.btn-warning {\r\n    position: relative;\r\n    overflow: hidden;\r\n}\r\n\r\n.btn-warning::before {\r\n    content: '';\r\n    position: absolute;\r\n    top: 0;\r\n    left: -100%;\r\n    width: 100%;\r\n    height: 100%;\r\n    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);\r\n    transition: left 0.5s ease;\r\n}\r\n\r\n.btn-warning:hover::before {\r\n    left: 100%;\r\n}\r\n\r\n/* Responsive design */\r\n@media (max-width: 768px) {\r\n    .contact-info-card,\r\n    .contact-form-card {\r\n        margin-bottom: 2rem;\r\n    }\r\n    \r\n    .contact-item {\r\n        margin-bottom: 1.5rem;\r\n    }\r\n    \r\n    .btn-lg {\r\n        padding: 0.75rem 2rem;\r\n    }\r\n}\r\n\r\n/* Phone input group sizing */\r\n.input-group select[name=\"country_code\"] {\r\n    flex: 0 0 110px;\r\n}\r\n\r\n@media (max-width: 576px) {\r\n    .input-group select[name=\"country_code\"] {\r\n        flex: 0 0 80px !important;\r\n        font-size: 0.85rem;\r\n        padding: .375rem .5rem;\r\n    }\r\n\r\n    .input-group #phone {\r\n        font-size: 0.95rem;\r\n        padding: .375rem .5rem;\r\n    }\r\n}\r\n\r\n/* Country flag spacing */\r\n.input-group-text img { display: block; }\r\n\r\n/* Success message styling */\r\n.alert-success {\r\n    background-color: rgba(25, 135, 84, 0.9);\r\n    border-color: #198754;\r\n    color: white;\r\n}\r\n\r\n/* Form validation styling */\r\n.is-valid {\r\n    border-color: #198754 !important;\r\n}\r\n\r\n.is-invalid {\r\n    border-color: #dc3545 !important;\r\n}\r\n\r\n/* Smooth transitions */\r\n.contact-info-card,\r\n.contact-form-card,\r\n.contact-item,\r\n.form-control,\r\n.btn-warning {\r\n    transition: all 0.3s ease;\r\n}\r\n</style>\r\n                    </div>\n\n        <!-- Footer Component -->\n        <div id=\"footer\">\n            <!-- Footer Component -->\r\n<footer class=\"py-5\" style=\"background-color: #1a1a1a;\" id=\"footer\">\r\n    <div class=\"container\">\r\n        <div class=\"row g-4\">\r\n            <!-- Company Information -->\r\n            <div class=\"col-lg-4 col-md-6\">\r\n                <div class=\"footer-brand mb-4\">\r\n                    <!-- Logo -->\r\n                    <div class=\"d-flex align-items-center mb-3\">\r\n                        \r\n                        \r\n                            <img src=\"http://localhost:8000/logo-white.svg\" alt=\"Luzori Logo\" style=\"height: 50px; width: auto;\" class=\"me-3\">\r\n                        \r\n                    </div>\r\n                    \r\n                    <!-- Company Description -->\r\n                    <p class=\"text-light mb-0 lh-lg\">\r\n                        We are a team of passionate developers and digital strategists dedicated to creating comprehensive salon and beauty center management solutions that streamline operations and enhance customer experiences.\r\n                    </p>\r\n                </div>\r\n            </div>\r\n            \r\n            <!-- Quick Links -->\r\n            <div class=\"col-lg-2 col-md-6\">\r\n                <div class=\"footer-section\">\r\n                    <h5 class=\"text-white fw-bold mb-4\">Quick Links</h5>\r\n                    <ul class=\"list-unstyled \">\r\n           