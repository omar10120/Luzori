              <script>
                  $(document).ready(function() {
                      const domainParam = null;
                      const postUrl = "http://localhost:8000/center_user/login" + (domainParam ? ("?domain=" + encodeURIComponent(domainParam)) : "");
                      $("#debug-post-url").text(postUrl);
                      $("#debug-domain").text(domainParam || '(none)');
                      $("#debug-host").text(window.location.host);

                      $("#frmLogin").on("submit", function(event) {
                          event.preventDefault();

                          $.ajax({
                              url: postUrl,
                              type: "POST",
                              data: new FormData(this),
                              contentType: false,
                              processData: false,
                              headers: domainParam ? { 'domain': domainParam } : {},
                              beforeSend: function() {
                                  $('#listError').empty();
                                  $("#alertError").hide();
                                  $(".submitFrom span").html('Login In Progress');
                                  $('.submitFrom').prop('disabled', true);
                              },
                              success: function(response, textStatus, xhr) {
                                  console.log('Login response:', response);
                                  $('#debug-response').text(JSON.stringify(response));
                                  
                                  if (xhr.status == 200) {
                                      // Check if response contains redirect_url (for root domain login)
                                      if (response.data && response.data.redirect_url) {
                                          console.log('Redirecting to:', response.data.redirect_url);
                                          window.location.href = response.data.redirect_url;
                                      } else {
                                          // For subdomain login, redirect to cp page
                                          console.log('No redirect_url found, using default redirect');
                                          window.location.href = "http://localhost:8000/center_user/cp" + (domainParam ? ("?domain=" + encodeURIComponent(domainParam)) : "");
                                      }
                                  } else {
                                      $("#alertError").show();
                                      $('#listError').html(response.message || 'Unexpected response');
                                  }

                                  $("html, body").animate({
                                      scrollTop: 0
                                  }, {
                                      duration: 1500,
                                  });
                                  $(".submitFrom span").html('Login');
                                  $('.submitFrom').prop('disabled', false);
                              },
                              error: function(response) {
                                  $("#alertError").show();
                                  var errors = response.responseJSON && response.responseJSON.errors;
                                  if (errors) {
                                      for (var error in errors) {
                                          var ul = document.getElementById("listError");
                                          var li = document.createElement("li");
                                          li.appendChild(document.createTextNode(errors[error]));
                                          ul.appendChild(li);
                                      }
                                  } else if (response.responseJSON && response.responseJSON.message) {
                                      $('#listError').html(response.responseJSON.message);
                                  } else {
                                      $('#listError').html('Login failed with status ' + response.status);
                                  }

                                  $("html, body").animate({
                                      scrollTop: 0
                                  }, {
                                      duration: 1500,
                                  });
                                  $(".submitFrom span").html('Login');
                                  $('.submitFrom').prop('disabled', false);
                              }
                          });
                      });
                  });
              </script>
