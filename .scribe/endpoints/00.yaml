rm='translateY(0)'\">\r\n                                        <div class=\"card-header border-0 bg-transparent p-0\">\r\n                                            <button class=\"btn btn-link w-100 text-start p-4 d-flex justify-content-between align-items-center faq-toggle\" onclick=\"toggleFAQ(this)\" style=\"text-decoration: none; color: white;\" data-bs-toggle=\"collapse\" data-bs-target=\"#faq-pricing-2\" aria-expanded=\"false\">\r\n                                                <h6 class=\"mb-0 fw-bold\">What payment methods do you accept for subscriptions?</h6>\r\n                                                <span class=\"faq-icon\" style=\"font-size: 1.5rem; color: #ffc107; transition: transform 0.3s ease;\">\r\n                                                    <span class=\"plus-icon\">+</span>\r\n                                                    <span class=\"minus-icon\" style=\"display: none;\">-</span>\r\n                                                </span>\r\n                                            </button>\r\n                                        </div>\r\n                                        <div class=\"collapse \" id=\"faq-pricing-2\">\r\n                                            <div class=\"card-body pt-0 pb-4 px-4\">\r\n                                                <p class=\"text-light mb-0 lh-lg\">We accept credit cards, bank transfers, and offer flexible payment plans including annual subscriptions with discounts.</p>\r\n                                            </div>\r\n                                        </div>\r\n                                    </div>\r\n                                </div>\r\n                                                            <div class=\"faq-item mb-3\" style=\"animation-delay: 0.3s;\">\r\n                                    <div class=\"card border-0 rounded-3\" style=\"background-color: #343a40; transition: all 0.3s ease;\" onmouseover=\"this.style.transform='translateY(-2px)'\" onmouseout=\"this.style.transform='translateY(0)'\">\r\n                                        <div class=\"card-header border-0 bg-transparent p-0\">\r\n                                            <button class=\"btn btn-link w-100 text-start p-4 d-flex justify-content-between align-items-center faq-toggle\" onclick=\"toggleFAQ(this)\" style=\"text-decoration: none; color: white;\" data-bs-toggle=\"collapse\" data-bs-target=\"#faq-pricing-3\" aria-expanded=\"false\">\r\n                                                <h6 class=\"mb-0 fw-bold\">Do you provide detailed quotes for salon setup?</h6>\r\n                                                <span class=\"faq-icon\" style=\"font-size: 1.5rem; color: #ffc107; transition: transform 0.3s ease;\">\r\n                                                    <span class=\"plus-icon\">+</span>\r\n                                                    <span class=\"minus-icon\" style=\"display: none;\">-</span>\r\n                                                </span>\r\n                                            </button>\r\n                                        </div>\r\n                                        <div class=\"collapse \" id=\"faq-pricing-3\">\r\n                                            <div class=\"card-body pt-0 pb-4 px-4\">\r\n                                                <p class=\"text-light mb-0 lh-lg\">Yes, we provide detailed quotes including setup costs, monthly subscriptions, and any additional features you may need.</p>\r\n                                            </div>\r\n                                        </div>\r\n                                    </div>\r\n                                </div>\r\n                                                    </div>\r\n                                    </div>\r\n            </div>\r\n        </div>\r\n    </div>\r\n</section>\r\n\r\n<script>\r\nfunction filterFAQ(category) {\r\n    // Remove active class from all tabs\r\n    document.querySelectorAll('.btn-group .btn').forEach(btn => {\r\n        btn.classList.remove('active', 'btn-warning');\r\n        btn.classList.add('btn-outline-warning');\r\n    });\r\n    \r\n    // Add active class to clicked tab\r\n    const activeTab = document.getElementById(category + '-tab');\r\n    activeTab.classList.add('active', 'btn-warning');\r\n    activeTab.classList.remove('btn-outline-warning');\r\n    \r\n    // Hide all FAQ categories\r\n    document.querySelectorAll('.faq-category').forEach(cat => {\r\n        cat.style.display = 'none';\r\n    });\r\n    \r\n    // Show selected category\r\n    document.getElementById('faq-' + category).style.display = 'block';\r\n    \r\n    // Reset all FAQ items in the new category\r\n    const categoryFAQs = document.querySelectorAll('#faq-' + category + ' .faq-item');\r\n    categoryFAQs.forEach((item, index) => {\r\n        const collapse = item.querySelector('.collapse');\r\n        const icon = item.querySelector('.faq-icon');\r\n        const plusIcon = item.querySelector('.plus-icon');\r\n        const minusIcon = item.querySelector('.minus-icon');\r\n        \r\n        // Close all items\r\n        collapse.classList.remove('show');\r\n        plusIcon.style.display = 'inline';\r\n        minusIcon.style.display = 'none';\r\n        \r\n        // Add entrance animation\r\n        item.style.animation = 'fadeInUp 0.6s ease-out ' + (index * 0.1) + 's both';\r\n    });\r\n}\r\n\r\nfunction toggleFAQ(button) {\r\n    const collapse = button.nextElementSibling;\r\n    const icon = button.querySelector('.faq-icon');\r\n    const plusIcon = button.querySelector('.plus-icon');\r\n    const minusIcon = button.querySelector('.minus-icon');\r\n    \r\n    // Toggle collapse\r\n    if (collapse.classList.contains('show')) {\r\n        collapse.classList.remove('show');\r\n        plusIcon.style.display = 'inline';\r\n        minusIcon.style.display = 'none';\r\n        icon.style.transform = 'rotate(0deg)';\r\n    } else {\r\n        collapse.classList.add('show');\r\n        plusIcon.style.display = 'none';\r\n        minusIcon.style.display = 'inline';\r\n        icon.style.transform = 'rotate(180deg)';\r\n    }\r\n}\r\n\r\n// Initialize with general category\r\ndocument.addEventListener('DOMContentLoaded', function() {\r\n    filterFAQ('general');\r\n});\r\n</script>\r\n\r\n<style>\r\n/* FAQ Animations */\r\n@keyframes fadeInUp {\r\n    from {\r\n        opacity: 0;\r\n        transform: translateY(30px);\r\n    }\r\n    to {\r\n        opacity: 1;\r\n        transform: translateY(0);\r\n    }\r\n}\r\n\r\n@keyframes slideInLeft {\r\n    from {\r\n        opacity: 0;\r\n        transform: translateX(-50px);\r\n    }\r\n    to {\r\n        opacity: 1;\r\n        transform: translateX(0);\r\n    }\r\n}\r\n\r\n/* Section animations */\r\n.faq-container {\r\n    animation: fadeInUp 0.8s ease-out;\r\n}\r\n\r\n.faq-item {\r\n    animation: fadeInUp 0.6s ease-out both;\r\n}\r\n\r\n/* Tab Button Styles */\r\n.btn-group .btn {\r\n    transition: all 0.3s ease;\r\n}\r\n\r\n.btn-group .btn:hover {\r\n    transform: translateY(-2px);\r\n}\r\n\r\n/* FAQ Card Styles */\r\n.faq-item .card {\r\n    border: 1px solid rgba(255, 193, 7, 0.1);\r\n    transition: all 0.3s ease;\r\n}\r\n\r\n.faq-item .card:hover {\r\n    border-color: rgba(255, 193, 7, 0.3);\r\n    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);\r\n}\r\n\r\n/* FAQ Toggle Button */\r\n.faq-toggle {\r\n    transition: all 0.3s ease;\r\n}\r\n\r\n.faq-toggle:hover {\r\n    background-color: rgba(255, 193, 7, 0.1);\r\n}\r\n\r\n/* Icon Animation */\r\n.faq-icon {\r\n    transition: transform 0.3s ease;\r\n}\r\n\r\n.faq-icon:hover {\r\n    transform: scale(1.2);\r\n}\r\n\r\n/* Collapse Animation */\r\n.collapse {\r\n    transition: all 0.3s ease;\r\n}\r\n\r\n.collapse.show {\r\n    animation: slideInLeft 0.3s ease-out;\r\n}\r\n\r\n/* Responsive Design */\r\n@media (max-width: 768px) {\r\n    .btn-group {\r\n        flex-direction: column;\r\n        width: 100%;\r\n    }\r\n    \r\n    .btn-group .btn {\r\n        margin-bottom: 0.5rem;\r\n        margin-right: 0 !important;\r\n    }\r\n    \r\n    .faq-toggle {\r\n        padding: 1rem !important;\r\n    }\r\n    \r\n    .faq-toggle h6 {\r\n        font-size: 0.9rem;\r\n    }\r\n}\r\n\r\n/* Smooth transitions */\r\n.faq-category {\r\n    transition: all 0.3s ease;\r\n}\r\n\r\n.faq-item .card-body {\r\n    transition: all 0.3s ease;\r\n}\r\n\r\n/* Hover effects */\r\n.faq-item:hover .card {\r\n    transform: translateY(-2px);\r\n    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);\r\n}\r\n\r\n/* Active state styling */\r\n.btn-warning {\r\n    background-color: #ffc107 !important;\r\n    border-color: #ffc107 !important;\r\n    color: #212529 !important;\r\n}\r\n\r\n.btn-outline-warning:hover {\r\n    background-color: #ffc107;\r\n    border-color: #ffc107;\r\n    color: #212529;\r\n}\r\n</style>\r\n        \n        \n        <!-- Contact Component -->\n        <div id=\"contact\">\n            <!-- Contact Us Component -->\r\n<section class=\"py-5\" style=\"background-color: #212529;\" id=\"contact\">\r\n    <div class=\"container\">\r\n        <div class=\"row justify-content-center\">\r\n            <div class=\"col-lg-10\">\r\n                <!-- Contact Header -->\r\n                <div class=\"text-center mb-5\">\r\n                    <h2 class=\"display-8 fw-bold text-white mb-4\">\r\n                        Get in Touch\r\n                    </h2>\r\n                    <p class=\"fs-5 text-light \">Ready to start your project? Let&#039;s discuss how we can help bring your vision to life.</p>\r\n                </div>\r\n                \r\n                <div class=\"row g-4\">\r\n                    <!-- Contact Information Panel -->\r\n                    <div class=\"col-lg-4\">\r\n                        <div class=\"contact-info-card h-100 p-4 rounded-4 position-relative\" style=\"background: linear-gradient(135deg, #343a40 0%, #49