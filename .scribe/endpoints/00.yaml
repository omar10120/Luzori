out;\r\n}\r\n\r\n/* Mobile menu animation */\r\n.collapse.show {\r\n    animation: slideDown 0.3s ease-in-out;\r\n}\r\n\r\n/* Logo animation */\r\n.navbar-brand:hover .position-absolute {\r\n    animation: pulse 0.6s ease-in-out;\r\n}\r\n\r\n/* Social icons bounce effect */\r\n.social-icon {\r\n    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);\r\n}\r\n\r\n.social-icon:hover {\r\n    transform: scale(1.2) rotate(5deg);\r\n}\r\n</style>\r\n\r\n<script>\r\n// Active navigation highlighting\r\ndocument.addEventListener('DOMContentLoaded', function() {\r\n    const sections = document.querySelectorAll('section[id]');\r\n    const navLinks = document.querySelectorAll('.nav-link[href^=\"#\"]');\r\n    \r\n    // Function to update active nav link\r\n    function updateActiveNavLink() {\r\n        let current = '';\r\n        \r\n        sections.forEach(section => {\r\n            const sectionTop = section.offsetTop;\r\n            const sectionHeight = section.clientHeight;\r\n            if (scrollY >= (sectionTop - 200)) {\r\n                current = section.getAttribute('id');\r\n            }\r\n        });\r\n        \r\n        navLinks.forEach(link => {\r\n            link.classList.remove('text-warning');\r\n            link.classList.add('text-light');\r\n            \r\n            // Remove active underline\r\n            const underline = link.querySelector('.nav-underline');\r\n            if (underline) {\r\n                underline.style.width = '0%';\r\n            }\r\n            \r\n            // Check if this link corresponds to current section\r\n            if (link.getAttribute('href') === '#' + current) {\r\n                link.classList.remove('text-light');\r\n                link.classList.add('text-warning');\r\n                \r\n                // Add active underline\r\n                if (underline) {\r\n                    underline.style.width = '100%';\r\n                }\r\n            }\r\n        });\r\n    }\r\n    \r\n    // Update on scroll\r\n    window.addEventListener('scroll', updateActiveNavLink);\r\n    \r\n    // Update on page load\r\n    updateActiveNavLink();\r\n    \r\n    // Smooth scroll for navigation links\r\n    navLinks.forEach(link => {\r\n        link.addEventListener('click', function(e) {\r\n            e.preventDefault();\r\n            const targetId = this.getAttribute('href');\r\n            const targetSection = document.querySelector(targetId);\r\n            \r\n            if (targetSection) {\r\n                const offsetTop = targetSection.offsetTop - 100; // Account for header height\r\n                window.scrollTo({\r\n                    top: offsetTop,\r\n                    behavior: 'smooth'\r\n                });\r\n            }\r\n        });\r\n    });\r\n\r\n    // Close mobile menu when clicking outside or on a menu item\r\n    const mobileMenu = document.getElementById('mobileMenu');\r\n    const mobileToggler = document.querySelector('[data-bs-target=\"#mobileMenu\"]');\r\n    if (mobileMenu && mobileToggler) {\r\n        // Click outside to close\r\n        document.addEventListener('click', function(event) {\r\n            const isOpen = mobileMenu.classList.contains('show');\r\n            if (!isOpen) return;\r\n            const clickedInsideMenu = mobileMenu.contains(event.target);\r\n            const clickedToggler = mobileToggler.contains(event.target);\r\n            if (clickedInsideMenu || clickedToggler) return;\r\n            const bs = window.bootstrap;\r\n            if (bs && bs.Collapse) {\r\n                bs.Collapse.getOrCreateInstance(mobileMenu).hide();\r\n            } else {\r\n                mobileMenu.classList.remove('show');\r\n            }\r\n        });\r\n\r\n        // Click on any link/button inside menu to close\r\n        mobileMenu.querySelectorAll('a, button').forEach(function(el) {\r\n            el.addEventListener('click', function() {\r\n                const bs = window.bootstrap;\r\n                if (bs && bs.Collapse) {\r\n                    bs.Collapse.getOrCreateInstance(mobileMenu).hide();\r\n                } else {\r\n                    mobileMenu.classList.remove('show');\r\n                }\r\n            });\r\n        });\r\n    }\r\n});\r\n</script>    \n    <!-- Main Content -->\n    <main>\n        <!-- Hero Section -->\n        <section id=\"home\" class=\"hero-section d-flex align-items-center justify-content-center\">\n            <div class=\"container text-center\">\n                <div class=\"row justify-content-center\">\n                    <div class=\"col-lg-8\">\n                        <h1 class=\"display-8 fw-bold text-white mb-4\">\n                            Run Your Salon Smarter.\n                        </h1>\n                        <p class=\"fs-6 text-light mb-5\">\n                            Transform Your Salon Business With Our Comprehensive Management System. Streamline Operations, Boost Revenue, and Delight Your Customers!\n                        </p>\n                        <div class=\"d-flex justify-content-center gap-3 flex-wrap\">\n                            <a href=\"#contact\" class=\"btn btn-custom\">\n                                Get a Quote\n                            </a>\n                            <a href=\"#about\" class=\"btn btn-outline-custom\">\n                                Learn More\n                            </a>\n                        </div>\n                                </div>\n                            </div>\n                        </div>\n        </section>\n        \n        <!-- About Component -->\n        <div id=\"about\">\n            <!-- About Component -->\r\n<section class=\"py-5\" style=\"background-color: #212529;\" id=\"about\">\r\n    <div class=\"container\">\r\n        <div class=\"row justify-content-center\">\r\n            <div class=\"col-lg-10\">\r\n                <!-- About Header -->\r\n                <div class=\"text