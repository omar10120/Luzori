              <script>
                  $(document).ready(function() {
                      $("#frmLogin").on("submit", function(event) {
                          event.preventDefault();

                          $.ajax({
                              url: "http://localhost:8000/admin/login",
                              type: "POST",
                              data: new FormData(this),
                              contentType: false,
                              processData: false,
                              headers: {
                                  'X-CSRF-TOKEN': $('meta[name="csrf-token"]').attr('content') || $('input[name="_token"]').val(),
                                  'X-Requested-With': 'XMLHttpRequest'
                              },
                              beforeSend: function() {
                                  $('#listError').empty();
                                  $("#alertError").hide();
                                  $(".submitFrom span").html('Login In Progress');
                                  $('.submitFrom').prop('disabled', true);
                              },
                              success: function(response, textStatus, xhr) {
                                  if (xhr.status == 200) {
                                      window.location.href = "http://localhost:8000/admin/cp";
                                  } else {
                                      $("#alertError").show();
                                      $('#listError').html(data.message);
                                  }

                                  $("html, body").animate({
                                      scrollTop: 0
                                  }, {
                                      duration: 1500,
                                  });
                                  $(".submitFrom span").html('Login');
                                  $('.submitFrom').prop('disabled', false);
                              },
                              error: function(response) {
                                  $("#alertError").show();
                                  var errors = response.responseJSON.errors;
                                  if (errors) {
                                      for (var error in errors) {
                                          var ul = document.getElementById("listError");
                                          var li = document.createElement("li");
                                          li.appendChild(document.createTextNode(errors[error]));
                                          ul.appendChild(li);
                                      }
                                  } else {
                                      $('#listError').html(response.responseJSON.message);
                                  }

                                  $("html, body").animate({
                                      scrollTop: 0
                                  }, {
                                      duration: 1500,
                                  });
                                  $(".submitFrom span").html('Login');
                                  $('.submitFrom').prop('disabled', false);
                              }
                          });
                      });
                  });
              </script>
