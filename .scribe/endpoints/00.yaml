ounded-3\" style=\"background-color: #343a40; transition: all 0.3s ease;\" onmouseover=\"this.style.transform='translateY(-5px)'; this.style.boxShadow='0 10px 25px rgba(0,0,0,0.3)'\" onmouseout=\"this.style.transform='translateY(0)'; this.style.boxShadow='none'\">\r\n                                <div class=\"card-body text-center p-4\">\r\n                                    <!-- Icon -->\r\n                                    <div class=\"mb-3\">\r\n                                        <div class=\"d-inline-flex align-items-center justify-content-center rounded-circle\" style=\"width: 80px; height: 80px; background-color: rgba(255, 193, 7, 0.1); border: 2px solid #ffc107;\">\r\n                                                                                            <img src=\"http://localhost:8000/assets/icons/Marketing and Offers.svg\" alt=\"icon\" style=\"width: 40px; height: 40px; object-fit: contain;\">\r\n                                                                                    </div>\r\n                                    </div>\r\n                                    \r\n                                    <!-- Title -->\r\n                                    <h5 class=\"card-title text-white fw-bold mb-3\">celebrity cards</h5>\r\n                                    \r\n                                    <!-- Description -->\r\n                                    <p class=\"card-text text-light mb-4\">\r\n                                        Cards with benefits and discounts at many companies and points of sale\r\n                                    </p>\r\n                                    \r\n                                    <!-- What we offer -->\r\n                                    <div class=\"text-start\">\r\n                                        <h6 class=\"text-warning fw-bold mb-3\">What We Offer:</h6>\r\n                                        <ul class=\"list-unstyled text-light\">\r\n                                                                                            <li class=\"mb-2\">• Celebrity Benefits</li>\r\n                                                                                            <li class=\"mb-2\">• Discount System</li>\r\n                                                                                            <li class=\"mb-2\">• Service Packages</li>\r\n                                                                                    </ul>\r\n                                    </div>\r\n                                </div>\r\n                            </div>\r\n                        </div>\r\n                                            <div class=\"col-md-6 col-lg-4 service-card\" data-category=\"development\">\r\n                            <div class=\"card h-100 border-0 rounded-3\" style=\"background-color: #343a40; transition: all 0.3s ease;\" onmouseover=\"this.style.transform='translateY(-5px)'; this.style.boxShadow='0 10px 25px rgba(0,0,0,0.3)'\" onmouseout=\"this.style.transform='translateY(0)'; this.style.boxShadow='none'\">\r\n                                <div class=\"card-body text-center p-4\">\r\n                                    <!-- Icon -->\r\n                                    <div class=\"mb-3\">\r\n                                        <div class=\"d-inline-flex align-items-center justify-content-center rounded-circle\" style=\"width: 80px; height: 80px; background-color: rgba(255, 193, 7, 0.1); border: 2px solid #ffc107;\">\r\n                                                                                            <img src=\"http://localhost:8000/assets/icons/customer-service.svg\" alt=\"icon\" style=\"width: 40px; height: 40px; object-fit: contain;\">\r\n                                                                                    </div>\r\n                                    </div>\r\n                                    \r\n                                    <!-- Title -->\r\n                                    <h5 class=\"card-title text-white fw-bold mb-3\">packages</h5>\r\n                                    \r\n                                    <!-- Description -->\r\n                                    <p class=\"card-text text-light mb-4\">\r\n                                        Provide certain discounts on a range of services\r\n                                    </p>\r\n                                    \r\n                                    <!-- What we offer -->\r\n                                    <div class=\"text-start\">\r\n                                        <h6 class=\"text-warning fw-bold mb-3\">What We Offer:</h6>\r\n                                        <ul class=\"list-unstyled text-light\">\r\n                                                                                            <li class=\"mb-2\">• Service Packages</li>\r\n                                                                                            <li class=\"mb-2\">• Bundle Offers</li>\r\n                                                                                            <li class=\"mb-2\">• Discount System</li>\r\n                                                                                    </ul>\r\n                                    </div>\r\n                                </div>\r\n                            </div>\r\n                        </div>\r\n                                    </div>\r\n            </div>\r\n        </div>\r\n    </div>\r\n</section>\r\n\r\n<script>\r\nfunction filterServices(category) {\r\n    // Remove active class from all tabs\r\n    document.querySelectorAll('.btn-group .btn').forEach(btn => {\r\n        btn.classList.remove('active', 'btn-warning');\r\n        btn.classList.add('btn-outline-warning');\r\n    });\r\n    \r\n    // Add active class to clicked tab\r\n    const activeTab = document.getElementById(category + '-tab');\r\n    activeTab.classList.add('active', 'btn-warning');\r\n    activeTab.classList.remove('btn-outline-warning');\r\n    \r\n    // Filter service cards\r\n    const serviceCards = document.querySelectorAll('.service-card');\r\n    \r\n    serviceCards.forEach(card => {\r\n        if (category === 'all' || card.dataset.category === category) {\r\n            card.style.display = 'block';\r\n            card.style.animation = 'fadeInUp 0.5s ease-out';\r\n        } else {\r\n            card.style.display = 'none';\r\n        }\r\n    });\r\n}\r\n\r\n// Initialize with all services visible\r\ndocument.addEventListener('DOMContentLoaded', function() {\r\n    filterServices('all');\r\n});\r\n</script>\r\n\r\n<style>\r\n/* Service Cards Animation */\r\n@keyframes fadeInUp {\r\n    from {\r\n        opacity: 0;\r\n        transform: translateY(30px);\r\n    }\r\n    to {\r\n        opacity: 1;\r\n        transform: translateY(0);\r\n    }\r\n}\r\n\r\n.service-card {\r\n    animation: fadeInUp 0.6s ease-out;\r\n}\r\n\r\n.service-card:nth-child(1) { animation-delay: 0.1s; }\r\n.service-card:nth-child(2) { animation-delay: 0.2s; }\r\n.service-card:nth-child(3) { animation-delay: 0.3s; }\r\n.service-card:nth-child(4) { animation-delay: 0.4s; }\r\n.service-card:nth-child(5) { animation-delay: 0.5s; }\r\n.service-card:nth-child(6) { animation-delay: 0.6s; }\r\n\r\n/* Tab Button Styles */\r\n.btn-group .btn {\r\n    transition: all 0.3s ease;\r\n}\r\n\r\n.btn-group .btn:hover {\r\n    transform: translateY(-2px);\r\n}\r\n\r\n/* Card Hover Effects */\r\n.card {\r\n    border: 1px solid rgba(255, 193, 7, 0.1);\r\n}\r\n\r\n.card:hover {\r\n    border-color: rgba(255, 193, 7, 0.3);\r\n}\r\n\r\n/* Icon Animation */\r\n.card:hover .rounded-circle {\r\n    transform: scale(1.1);\r\n    transition: transform 0.3s ease;\r\n}\r\n</style>\r\n                        </div>\n\n        <!-- Our Work Component -->\n        <!-- Our Work Component -->\r\n \r\n\r\n\r\n\r\n\r\n<style>\r\n/* Device Animation */\r\n@keyframes float {\r\n    0%, 100% {\r\n        transform: translateY(0px);\r\n    }\r\n    50% {\r\n        transform: translateY(-10px);\r\n    }\r\n}\r\n\r\n.device-container {\r\n    animation: float 3s ease-in-out infinite;\r\n}\r\n\r\n.device-container:nth-child(1) {\r\n    animation-delay: 0s;\r\n}\r\n\r\n.device-container:nth-child(2) {\r\n    animation-delay: 1s;\r\n}\r\n\r\n.device-container:nth-child(3) {\r\n    animation-delay: 2s;\r\n}\r\n\r\n/* Device Hover Effects */\r\n.device-container:hover {\r\n    animation-play-state: paused;\r\n}\r\n\r\n/* Button Glow Effect */\r\n.btn-warning {\r\n    background: linear-gradient(135deg, #ffc107 0%, #ff8c00 100%);\r\n    border: none;\r\n    position: relative;\r\n    overflow: hidden;\r\n}\r\n\r\n.btn-warning::before {\r\n    content: '';\r\n    position: absolute;\r\n    top: 0;\r\n    left: -100%;\r\n    width: 100%;\r\n    height: 100%;\r\n    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);\r\n    transition: left 0.5s ease;\r\n}\r\n\r\n.btn-warning:hover::before {\r\n    left: 100%;\r\n}\r\n\r\n/* Responsive Design */\r\n@media (max-width: 768px) {\r\n    .device-container {\r\n        margin-bottom: 2rem;\r\n    }\r\n    \r\n    .device-container img {\r\n        max-width: 150px !important;\r\n    }\r\n    \r\n    .device-container svg {\r\n        width: 60px !important;\r\n        height: 120px !important;\r\n    }\r\n}\r\n\r\n/* Text Animation */\r\n@keyframes slideInUp {\r\n    from {\r\n        opacity: 0;\r\n        transform: translateY(30px);\r\n    }\r\n    to {\r\n        opacity: 1;\r\n        transform: translateY(0);\r\n    }\r\n}\r\n\r\n.text-center > * {\r\n    animation: slideInUp 0.8s ease-out;\r\n}\r\n\r\n.text-center > *:nth-child(1) { animation-delay: 0.1s; }\r\n.text-center > *:nth-child(2) { animation-delay: 0.2s; }\r\n.text-center > *:nth-child(3) { animation-delay: 0.3s; }\r\n</style>\r\n        \n        <!-- Why Customers Component -->\n        <!-- Why Customers Component -->\r\n<section class=\"py-5\" style=\"background-color: #212529;\">\r\n    <div class=\"container\">\r\n        <div class=\"row justify-content-center\">\r\n            <div class=\"col-lg-10\">\r\n                <!-- Section Header -->\r\n                <div class=\"text-center mb-5\">\r\n                    <h2 class=\"display-8 fw-bold text-white mb-4\">\r\n                        Why Customers  Love Working With Us\r\n                    </h2>\r\n                    <p class=\"fs-5 text-light\">We pride ourselves on delivering exceptional results and building long-lasting relationships with our clients.</p>\r\n                </div>\r\n                \r\n                <!-- Testimonial Carousel -->\r\n                <div class=\"testimonial-container position-relative\">\r\n                    <!-- Navigation Arrows -->\r\n                    <button class=\"testimonial-nav testimonial-prev position-absolute top-50 start-0 translate-middle-y\" onclick=\"changeTestimonial(-1)\" style=\"z-index: 10; background: none; border: none; color: #ffc107; font-size: 2rem; transition: all 0.3s ease;\" onmouseover=\"this.style.transform='translateY(-50%) scale(1.2)'\" onmouseout=\"this.style.transform='translateY(-50%) scale(1)'\">\r\n                        <svg width=\"24\" height=\"24\" fill=\"currentColor\" viewBox=\"0 0 24 24\">\r\n                            <path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\"/>\r\n                        </svg>\r\n                    </button>\r\n                    \r\n                    <button class=\"testimonial-nav testimonial-next position-absolute top-50 end-0 translate-middle-y\" onclick=\"changeTestimonial(1)\" style=\"z-index: 10; background: none; border: none; color: #ffc107; font-size: 2rem; transition: all 0.3s ease;\" onmouseover=\"this.style.transform='translateY(-50%) scale(1.2)'\" onmouseout=\"this.style.transform='translateY(-50%) scale(1)'\">\r\n                        <svg width=\"24\" height=\"24\" fill=\"currentColor\" viewBox=\"0 0 24 24\">\r\n                            <path d=\"M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z\"/>\r\n                        </svg>\r\n                    </button>\r\n                    \r\n                    <!-- Testimonial Card -->\r\n                    <div class=\"testimonial-card mx-auto position-relative\" style=\"max-width: 800px; background-color: #000; border-radius: 15px; padding: 3rem; min-height: 200px; transition: all 0.5s ease;\">\r\n                        <!-- Opening Quote -->\r\n                        <div class=\"position-absolute top-0 start-0\" style=\"font-size: 4rem; color: #ffc107; line-height: 1; transform: translate(-10px, -10px);\">\r\n                            \"\r\n                        </div>\r\n                        \r\n                        <!-- Testimonial Content -->\r\n                        <div class=\"testimonial-content text-center\">\r\n                            <p class=\"fs-4 text-white mb-0 lh-lg testimonial-text\" id=\"testimonial-text\">\r\n                                Working with Luzori was a game-changer for our startup. They delivered a stunning website that perfectly captured our brand vision and helped us attract more customers.\r\n                            </p>\r\n                        </div>\r\n                        \r\n                        <!-- Closing Quote -->\r\n                        <div class=\"position-absolute bottom-0 end-0\" style=\"font-size: 4rem; color: #ffc107; line-height: 1; transform: translate(10px, 10px);\">\r\n                            \"\r\n                        </div>\r\n                    </div>\r\n                </div>\r\n                \r\n                <!-- Pagination Dots -->\r\n                <div class=\"text-center mt-4\">\r\n                    <div class=\"pagination-dots d-flex justify-content-center align-items-center gap-2\">\r\n                                                \r\n                                                    <button class=\"pagination-dot \" onclick=\"goToTestimonial(0)\" style=\"width: 12px; height: 12px; border-radius: 50%; border: none; background-color: #6c757d; transition: all 0.3s ease;\" onmouseover=\"this.style.transform='scale(1.2)'\" onmouseout=\"this.style.transform='scale(1)'\"></button>\r\n                                                    <button class=\"pagination-dot active\" onclick=\"goToTestimonial(1)\" style=\"width: 12px; height: 12px; border-radius: 50%; border: none; background-color: #ffc107; transition: all 0.3s ease;\" onmouseover=\"this.style.transform='scale(1.2)'\" onmouseout=\"this.style.transform='scale(1)'\"></button>\r\n                                                    <button class=\"pagination-dot \" onclick=\"goToTestimonial(2)\" style=\"width: 12px; height: 12px; border-radius: 50%; border: none; background-color: #6c757d; transition: all 0.3s ease;\" onmouseover=\"this.style.transform='scale(1.2)'\" onmouseout=\"this.style.transform='scale(1)'\"></button>\r\n                                                    <button class=\"pagination-dot \" onclick=\"goToTestimonial(3)\" style=\"width: 12px; height: 12px; border-radius: 50%; border: none; background-color: #6c757d; transition: all 0.3s ease;\" onmouseover=\"this.style.transform='scale(1.2)'\" onmouseout=\"this.style.transform='scale(1)'\"></button>\r\n                                                    <button class=\"pagination-dot \" onclick=\"goToTestimonial(4)\" style=\"width: 12px; height: 12px; border-radius: 50%; border: none; background-color: #6c757d; transition: all 0.3s ease;\" onmouseover=\"this.style.transform='scale(1.2)'\" onmouseout=\"this.style.transform='scale(1)'\"></button>\r\n                                            </div>\r\n                </div>\r\n            </div>\r\n        </div>\r\n    </div>\r\n</section>\r\n\r\n<script>\r\nlet currentTestimonial = 1; // Start with second testimonial (index 1)\r\nconst testimonials = [\"Luzori transformed our business with their exceptional web design and development services. Their attention to detail and innovative solutions exceeded our expectations. Highly recommended!\",\"Working with Luzori was a game-changer for our startup. They delivered a stunning website that perfectly captured our brand vision and helped us attract more customers.\",\"The team at Luzori is incredibly professional and talented. They took our complex requirements and turned them into a beautiful, functional digital solution that our users love.\",\"Luzori\\u0027s mobile app development expertise helped us reach our customers on all platforms. The app they built is fast, intuitive, and exactly what we needed.\",\"From concept to launch, Luzori guided us through every step of our digital transformation. Their strategic approach and technical excellence made all the difference.\"];\r\n\r\nfunction changeTestimonial(direction) {\r\n    const testimonialText = document.getElementById('testimonial-text');\r\n    const dots = document.querySelectorAll('.pagination-dot');\r\n    \r\n    // Add fade out animation\r\n    testimonialText.style.opacity = '0';\r\n    testimonialText.style.transform = 'translateY(20px)';\r\n    \r\n    setTimeout(() => {\r\n        // Update testimonial\r\n        currentTestimonial += direction;\r\n        \r\n        // Loop around\r\n        if (currentTestimonial < 0) {\r\n            currentTestimonial = testimonials.length - 1;\r\n        } else if (currentTestimonial >= testimonials.length) {\r\n            currentTestimonial = 0;\r\n        }\r\n        \r\n        // Update content\r\n        testimonialText.textContent = testimonials[currentTestimonial];\r\n        \r\n        // Update dots\r\n        dots.forEach((dot, index) => {\r\n            dot.classList.remove('active');\r\n            dot.style.backgroundColor = index === currentTestimonial ? '#ffc107' : '#6c757d';\r\n        });\r\n        \r\n        // Add fade in animation\r\n        testimonialText.style.opacity = '1';\r\n        testimonialText.style.transform = 'translateY(0)';\r\n    }, 250);\r\n}\r\n\r\nfunction goToTestimonial(index) {\r\n    const testimonialText = document.getElementById('testimonial-text');\r\n    const dots = document.querySelectorAll('.pagination-dot');\r\n    \r\n    if (index === currentTestimonial) return;\r\n    \r\n    // Add fade out animation\r\n    testimonialText.style.opacity = '0';\r\n    testimonialText.style.transform = 'translateY(20px)';\r\n    \r\n    setTimeout(() => {\r\n        // Update testimonial\r\n        currentTestimonial = index;\r\n        \r\n        // Update content\r\n        testimonialText.textContent = testimonials[currentTestimonial];\r\n        \r\n        // Update dots\r\n        dots.forEach((dot, dotIndex) => {\r\n            dot.classList.remove('active');\r\n            dot.style.backgroundColor = dotIndex === currentTestimonial ? '#ffc107' : '#6c757d';\r\n        });\r\n        \r\n        // Add fade in animation\r\n        testimonialText.style.opacity = '1';\r\n        testimonialText.style.transform = 'translateY(0)';\r\n    }, 250);\r\n}\r\n\r\n// Auto-rotate testimonials every 5 seconds\r\nsetInterval(() => {\r\n    changeTestimonial(1);\r\n}, 5000);\r\n\r\n// Initialize\r\ndocument.addEventListener('DOMContentLoaded', function() {\r\n    const testimonialText = document.getElementById('testimonial-text');\r\n    testimonialText.style.transition = 'all 0.5s ease';\r\n});\r\n</script>\r\n\r\n<style>\r\n/* Testimonial Animations */\r\n@keyframes fadeInUp {\r\n    from {\r\n        opacity: 0;\r\n        transform: translateY(30px);\r\n    }\r\n    to {\r\n        opacity: 1;\r\n        transform: translateY(0);\r\n    }\r\n}\r\n\r\n@keyframes slideInLeft {\r\n    from {\r\n        opacity: 0;\r\n        transform: translateX(-50px);\r\n    }\r\n    to {\r\n        opacity: 1;\r\n        transform: translateX(0);\r\n    }\r\n}\r\n\r\n@keyframes slideInRight {\r\n    from {\r\n        opacity: 0;\r\n        transform: translateX(50px);\r\n    }\r\n    to {\r\n        opacity: 1;\r\n        transform: translateX(0);\r\n    }\r\n}\r\n\r\n/* Section animations */\r\n.testimonial-container {\r\n    animation: fadeInUp 0.8s ease-out;\r\n}\r\n\r\n.testimonial-card {\r\n    animation: slideInLeft 1s ease-out;\r\n    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);\r\n}\r\n\r\n.testimonial-card:hover {\r\n    transform: translateY(-5px);\r\n    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);\r\n}\r\n\r\n/* Quote animations */\r\n.testimonial-card .position-absolute:first-child {\r\n    animation: slideInLeft 1.2s ease-out 0.3s both;\r\n}\r\n\r\n.testimonial-card .position-absolute:last-child {\r\n    animation: slideInRight 1.2s ease-out 0.3s both;\r\n}\r\n\r\n/* Text animation */\r\n.testimonial-text {\r\n    animation: fadeInUp 1s ease-out 0.5s both;\r\n}\r\n\r\n/* Navigation arrows */\r\n.testimonial-nav {\r\n    opacity: 0.7;\r\n}\r\n\r\n.testimonial-nav:hover {\r\n    opacity: 1;\r\n    color: #e0a800 !important;\r\n}\r\n\r\n/* Pagination dots */\r\n.pagination-dot {\r\n    cursor: pointer;\r\n}\r\n\r\n.pagination-dot:hover {\r\n    background-color: #ffc107 !important;\r\n}\r\n\r\n.pagination-dot.active {\r\n    transform: scale(1.2);\r\n}\r\n\r\n/* Responsive design */\r\n@media (max-width: 768px) {\r\n    .testimonial-card {\r\n        padding: 2rem !important;\r\n        margin: 0 1rem;\r\n    }\r\n    \r\n    .testimonial-nav {\r\n        display: none;\r\n    }\r\n    \r\n    .testimonial-card .position-absolute:first-child,\r\n    .testimonial-card .position-absolute:last-child {\r\n        font-size: 3rem !important;\r\n    }\r\n}\r\n\r\n/* Smooth transitions */\r\n.testimonial-text {\r\n    transition: all 0.5s ease;\r\n}\r\n\r\n.pagination-dot {\r\n    transition: all 0.3s ease;\r\n}\r\n\r\n/* Card entrance animation */\r\n.testimonial-card {\r\n    animation: fadeInUp 0.8s ease-out;\r\n}\r\n\r\n/* Quote mark animations */\r\n@keyframes quoteAppear {\r\n    from {\r\n        opacity: 0;\r\n        transform: scale(0);\r\n    }\r\n    to {\r\n        opacity: 1;\r\n        transform: scale(1);\r\n    }\r\n}\r\n\r\n.testimonial-card .position-absolute:first-child,\r\n.testimonial-card .position-absolute:last-child {\r\n    animation: quoteAppear 0.6s ease-out 0.8s both;\r\n}\r\n</style>\r\n        \n        <!-- FAQ Component -->\n        <!-- FAQ Component -->\r\n<section class=\"py-5\" style=\"background-color: #212529;\">\r\n    <div class=\"container\">\r\n        <div class=\"row justify-content-center\">\r\n            <div class=\"col-lg-10\">\r\n                <!-- FAQ Header -->\r\n                <div class=\"text-center mb-5\">\r\n                    <h2 class=\"display-8 fw-bold text-white mb-4\">\r\n                        Frequently Asked  Questions\r\n                    </h2>\r\n                    <p class=\"fs-5 text-light\">Find answers to common questions about our services and processes.</p>\r\n                </div>\r\n                \r\n                <!-- FAQ Categories -->\r\n                <div class=\"text-center mb-5\">\r\n                    <div class=\"btn-group\" role=\"group\" aria-label=\"FAQ categories\">\r\n                        <button type=\"button\" class=\"btn btn-outline-warning me-2 px-4 py-2 rounded-pill active\" onclick=\"filterFAQ('general')\" id=\"general-tab\">\r\n                            General\r\n                        </button>\r\n                        <button type=\"button\" class=\"btn btn-outline-warning me-2 px-4 py-2 rounded-pill\" onclick=\"filterFAQ('services')\" id=\"services-tab\">\r\n                            Services\r\n                        </button>\r\n                        <button type=\"button\" class=\"btn btn-outline-warning me-2 px-4 py-2 rounded-pill\" onclick=\"filterFAQ('support')\" id=\"support-tab\">\r\n                            Support\r\n                        </button>\r\n                        <button type=\"button\" class=\"btn btn-outline-warning px-4 py-2 rounded-pill\" onclick=\"filterFAQ('pricing')\" id=\"pricing-tab\">\r\n                            Pricing\r\n                        </button>\r\n                    </div>\r\n                </div>\r\n                \r\n                <!-- FAQ Accordion -->\r\n                <div class=\"faq-container\">\r\n                                        \r\n                                            <div class=\"faq-category\" id=\"faq-general\" style=\"display: block;\">\r\n                                                            <div class=\"faq-item mb-3\" style=\"animation-delay: 0s;\">\r\n                                    <div class=\"card border-0 rounded-3\" style=\"background-color: #343a40; transition: all 0.3s ease;\" onmouseover=\"this.style.transform='translateY(-2px)'\" onmouseout=\"this.style.transform='translateY(0)'\">\r\n                                        <div class=\"card-header border-0 bg-transparent p-0\">\r\n                                            <button class=\"btn btn-link w-100 text-start p-4 d-flex justify-content-between align-items-center faq-toggle\" onclick=\"toggleFAQ(this)\" style=\"text-decoration: none; color: white;\" data-bs-toggle=\"collapse\" data-bs-target=\"#faq-general-0\" aria-expanded=\"true\">\r\n                                                <h6 class=\"mb-0 fw-bold\">How quickly can you set up our salon management system?</h6>\r\n                                                <span class=\"faq-icon\" style=\"font-size: 1.5rem; color: #ffc107; transition: transform 0.3s ease;\">\r\n                                                    <span class=\"plus-icon\">+</span>\r\n                                                    <span class=\"minus-icon\" style=\"display: none;\">-</span>\r\n                                                </span>\r\n                                            </button>\r\n                                        </div>